name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # ARM cross toolchain for the @gba-kit/debug-info little-endian test ELFs
      - name: Install arm-none-eabi GCC 14
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      # Big-endian cross toolchains for the mips-min / ppc-min test projects. The
      # runner is x86 Linux, so these stock Ubuntu packages run natively — no
      # Docker or qemu. vitest's globalSetup rebuilds every project when CI is set.
      - name: Install big-endian cross toolchains
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-mips-linux-gnu binutils-mips-linux-gnu \
            gcc-powerpc-linux-gnu binutils-powerpc-linux-gnu

      # Build the agbcc (GCC 2.95) compiler from the submodule once
      - name: Resolve agbcc commit
        id: agbcc-rev
        run: echo "sha=$(git rev-parse HEAD:packages/debug-info/test-projects/agbcc-min/agbcc)" >> "$GITHUB_OUTPUT"
      - name: Cache agbcc compiler
        id: agbcc-cache
        uses: actions/cache@v4
        with:
          path: packages/debug-info/test-projects/agbcc-min/agbcc/agbcc
          key: agbcc-${{ runner.os }}-${{ steps.agbcc-rev.outputs.sha }}
      - name: Build agbcc compiler
        if: steps.agbcc-cache.outputs.cache-hit != 'true'
        run: ./build.sh
        working-directory: packages/debug-info/test-projects/agbcc-min/agbcc

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build
      - run: pnpm turbo test
      - run: pnpm turbo check-types
      - run: pnpm turbo lint
      - run: pnpm turbo check-deps
      - run: pnpm run format:check
